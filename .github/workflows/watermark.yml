name: Video Watermark

on:
  workflow_dispatch:

jobs:
  watermark:
    runs-on: ubuntu-latest

    steps:

      - name: Install FFmpeg and LFTP
        run: |
          sudo apt update
          sudo apt install -y ffmpeg lftp

      - name: Download video
        run: |
          wget -O video.mp4 "https://apitest1403.ir/github_action/video.mp4"
          ls -lh video.mp4

      - name: Download watermark
        run: |
          wget -O logo.png "https://apitest1403.ir/github_action/logo.png"
          ls -lh logo.png

      - name: Add watermark
        run: |
          ffmpeg \
            -i video.mp4 \
            -i logo.png \
            -filter_complex "[1:v]scale=200:-1[logo];[0:v][logo]overlay=W-w-30:30" \
            -c:a copy \
            output.mp4

      - name: Check output
        run: |
          ls -lh output.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      - name: Test FTP connection
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Testing FTP connection..."

          lftp -d -c "
            set ftp:ssl-force false
            set ftp:passive-mode true
            set net:timeout 20
            set net:max-retries 2
            open ftp://$FTP_HOST
            user $FTP_USERNAME $FTP_PASSWORD
            pwd
            ls
            bye
          "

      - name: Upload output
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Uploading output.mp4..."

          lftp -d -c "
            set ftp:ssl-force false
            set ftp:passive-mode true
            set net:timeout 30
            set net:max-retries 2

            open ftp://$FTP_HOST
            user $FTP_USERNAME $FTP_PASSWORD

            pwd
            ls

            cd public_html
            ls

            cd github_action
            ls

            put output.mp4 -o output.mp4

            ls
            bye
          "

      - name: Verify upload
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Checking uploaded file..."

          lftp -c "
            set ftp:ssl-force false
            open ftp://$FTP_HOST
            user $FTP_USERNAME $FTP_PASSWORD
            cd public_html/github_action
            ls -lh output.mp4
            bye
          "

      - name: Done
        run: |
          echo "======================================"
          echo "UPLOAD SUCCESSFUL"
          echo "======================================"
          echo "https://apitest1403.ir/github_action/output.mp4"

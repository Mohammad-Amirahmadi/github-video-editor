name: Video Watermark

on:
  workflow_dispatch:

jobs:
  watermark:
    runs-on: ubuntu-latest

    steps:

      - name: Install FFmpeg and LFTP
        run: |
          sudo apt update
          sudo apt install -y ffmpeg lftp

      - name: Download video
        run: |
          wget -O video.mp4 "https://apitest1403.ir/github_action/video.mp4"
          ls -lh video.mp4

      - name: Download watermark
        run: |
          wget -O logo.png "https://apitest1403.ir/github_action/logo.png"
          ls -lh logo.png

      - name: Add watermark
        run: |
          ffmpeg \
            -i video.mp4 \
            -i logo.png \
            -filter_complex "[1:v]scale=200:-1[logo];[0:v][logo]overlay=W-w-30:30" \
            -c:a copy \
            output.mp4

      - name: Check output
        run: |
          ls -lh output.mp4
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      - name: Test FTP connection
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP HOST: $FTP_HOST"
          echo "FTP USER: $FTP_USERNAME"

          lftp -d -c "
            set ftp:ssl-force false
            set ftp:ssl-protect-data false
            set ftp:passive-mode true
            set net:timeout 30
            set net:max-retries 2
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST
            pwd
            ls
            bye
          "

      - name: Upload output to hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -d -c "
            set ftp:ssl-force false
            set ftp:ssl-protect-data false
            set ftp:passive-mode true
            set net:timeout 60
            set net:max-retries 3

            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST

            pwd
            ls

            cd public_html/github_action

            put output.mp4 -o output.mp4

            ls -lh output.mp4

            bye
          "

      - name: Verify upload
        run: |
          echo "Upload finished."
          echo "Expected URL:"
          echo "https://apitest1403.ir/github_action/output.mp4"

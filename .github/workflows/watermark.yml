name: Video Watermark

on:
  workflow_dispatch:

jobs:
  watermark:
    runs-on: ubuntu-latest

    steps:

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg lftp

      - name: Download video
        run: |
          wget "https://apitest1403.ir/github_action/video.mp4" -O video.mp4

      - name: Download watermark
        run: |
          wget "https://apitest1403.ir/github_action/logo.png" -O logo.png

      - name: Check files
        run: |
          ls -lh video.mp4
          ls -lh logo.png

      - name: Add watermark
        run: |
          ffmpeg \
            -i video.mp4 \
            -i logo.png \
            -filter_complex "[1:v]scale=200:-1[logo];[0:v][logo]overlay=W-w-30:30" \
            -c:a copy \
            output.mp4

      - name: Check output
        run: |
          ls -lh output.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      - name: Upload output to hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force false
            set ftp:passive-mode true
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST
            cd public_html/github_action
            put output.mp4
            bye
          "

      - name: Done
        run: |
          echo "Upload completed successfully."
          echo "https://apitest1403.ir/github_action/output.mp4"

name: Video Watermark

on:
  workflow_dispatch:

jobs:
  watermark:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Install FFmpeg
      # ==============================
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      # ==============================
      # Download video
      # ==============================
      - name: Download video
        run: |
          wget -O video.mp4 "https://apitest1403.ir/github_action/video.mp4"
          ls -lh video.mp4

      # ==============================
      # Download watermark
      # ==============================
      - name: Download watermark
        run: |
          wget -O logo.png "https://apitest1403.ir/github_action/logo.png"
          ls -lh logo.png

      # ==============================
      # Add watermark
      # ==============================
      - name: Add watermark
        run: |
          ffmpeg \
            -i video.mp4 \
            -i logo.png \
            -filter_complex "[1:v]scale=200:-1[logo];[0:v][logo]overlay=W-w-30:30" \
            -c:a copy \
            output.mp4

      # ==============================
      # Check output
      # ==============================
      - name: Check output
        run: |
          ls -lh output.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      # ==============================
      # Upload to PHP API
      # ==============================
      - name: Upload output to hosting
        env:
          UPLOAD_SECRET: 'abc123XYZ789_test_2026'

        run: |
          echo "Uploading output.mp4..."

          curl \
            --fail \
            --show-error \
            --silent \
            -X POST \
            -F "secret=$UPLOAD_SECRET" \
            -F "video=@output.mp4" \
            "https://apitest1403.ir/github_action/upload.php"

          echo ""
          echo "Upload request completed."

      # ==============================
      # Verify
      # ==============================
      - name: Verify upload
        run: |
          echo "======================================"
          echo "UPLOAD COMPLETED"
          echo "======================================"
          echo ""
          echo "Output URL:"
          echo "https://apitest1403.ir/github_action/output.mp4"
